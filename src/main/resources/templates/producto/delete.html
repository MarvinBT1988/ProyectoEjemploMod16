<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Eliminar Producto</title>
</head>
<body>
    <div layout:fragment="content">
        <h1>Eliminar Producto</h1>
        <div class="alert alert-danger">
            <h3>¿Está seguro que desea eliminar este producto?</h3>
        </div>
        <dl class="row">
            <dt class="col-sm-2">ID:</dt>
            <dd class="col-sm-10" th:text="${producto.id}"></dd>

            <dt class="col-sm-2">Nombre:</dt>
            <dd class="col-sm-10" th:text="${producto.nombre}"></dd>

            <dt class="col-sm-2">Descripción:</dt>
            <dd class="col-sm-10" th:text="${producto.descripcion}"></dd>

            <dt class="col-sm-2">Imagen:</dt>
            <dd class="col-sm-10">
                <img th:if="${producto.imagen != null}" 
                     th:src="@{'/producto/imagen/' + ${producto.id}}"
                     style="max-width: 200px; max-height: 200px;"/>
                <span th:if="${producto.imagen == null}">Sin imagen</span>
            </dd>
        </dl>
        <form th:action="@{/producto/delete}" method="post">
             <input type="hidden" name="Id" th:value="${producto.id}">
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a th:href="@{/producto}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
