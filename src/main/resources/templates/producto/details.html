<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Detalles del Producto</title>
</head>
<body>
    <div layout:fragment="content">
        <h1>Detalles del Producto</h1>
        <dl class="row">
            <dt class="col-sm-2">ID:</dt>
            <dd class="col-sm-10" th:text="${producto.id}"></dd>

            <dt class="col-sm-2">Nombre:</dt>
            <dd class="col-sm-10" th:text="${producto.nombre}"></dd>

            <dt class="col-sm-2">Descripción:</dt>
            <dd class="col-sm-10" th:text="${producto.descripcion}"></dd>

            <dt class="col-sm-2">Imagen:</dt>
            <dd class="col-sm-10">
                <img th:if="${producto.imagen != null}" 
                     th:src="@{'/producto/imagen/' + ${producto.id}}"
                     style="max-width: 300px; max-height: 300px;"/>
                <span th:if="${producto.imagen == null}">Sin imagen</span>
            </dd>
        </dl>
        <div>
            <a th:href="@{/producto/edit/{id}(id=${producto.id})}" class="btn btn-warning">Editar</a>
            <a th:href="@{/producto}" class="btn btn-secondary">Volver a la lista</a>
        </div>
    </div>
</body>
</html>
