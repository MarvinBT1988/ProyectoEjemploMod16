<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/_mainLayout}">

<head>
    <title>Crear Producto</title>
</head>

<body>
    <div layout:fragment="content">
        <h1>Crear Producto</h1>
        <form th:action="@{/producto/save}" th:object="${producto}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required />
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger"></span>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" required></textarea>
                <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}" class="text-danger"></span>
            </div>
            <div class="form-group">
                <label for="imagenFile">Imagen:</label>
                <input type="file" class="form-control" id="imagenFile" name="fileImagen" accept="image/*" />
                <img id="vista-previa" src="#" alt="Vista previa de la imagen" style="max-width: 300px; display: none;">
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/producto}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
        <script>
            const imagenInput = document.getElementById('imagenFile');
            const vistaPrevia = document.getElementById('vista-previa');

            imagenInput.addEventListener('change', function (event) {
                const archivo = event.target.files[0];
                if (archivo) {
                    const lector = new FileReader();

                    lector.onload = function (e) {
                        vistaPrevia.src = e.target.result;
                        vistaPrevia.style.display = 'block';
                    };

                    lector.readAsDataURL(archivo);
                } else {
                    vistaPrevia.src = '#';
                    vistaPrevia.style.display = 'none';
                }
            });
        </script>
    </div>
</body>

</html>
